[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botenclave"
version = "0.1.0"
description = "Security-first, Docker-free web panel for managing multiple Discord bots"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "fastapi-users[sqlalchemy]>=14,<16",
    "aiosqlite>=0.20",
    "argon2-cffi>=23",
    "pyotp>=2.9",
    "cryptography>=42",
    "httpx>=0.27",
]

[project.scripts]
botmgr = "botmgr.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "setuptools>=84.1.0",
]

[tool.setuptools.packages.find]
include = ["botmgr*"]

[tool.setuptools.package-data]
botmgr = ["templates/*.html", "static/vendor/xterm/*", "tmux.conf"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: Depends() in argument defaults is the FastAPI idiom, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
