# BotEnclave tmux server defaults.
# Loaded with -f when the helper starts a bot's tmux server, so these apply
# to the very first pane (setting them afterwards would race the bot).
# Bot users have a nologin login shell, so panes must use /bin/sh directly.
set-option -g default-shell /bin/sh
# Keep dead panes around so the exit status can be collected.
set-option -g remain-on-exit on
# Console scrollback is a place secrets can linger; keep it small.
set-option -g history-limit 2000
