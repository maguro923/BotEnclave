{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>{{ t('login.title') }}</h1>
  <form id="login-form">
    <p><input type="email" id="email" placeholder="{{ t('login.email') }}" required style="width: 100%;"></p>
    <p class="pw-row"><input type="password" id="password" placeholder="{{ t('login.password') }}" required>
      <button type="button" class="secondary" data-pw-toggle="password" onclick="togglePw(this)">{{ t('common.show') }}</button></p>
    <p id="totp-row" hidden><input type="text" id="totp" placeholder="{{ t('login.totp') }}" autocomplete="one-time-code" style="width: 100%;"></p>
    <p id="error" class="error"></p>
    <button type="submit" style="width: 100%;">{{ t('login.submit') }}</button>
  </form>
</div>
<script>
const form = document.getElementById('login-form');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
  };
  const totp = document.getElementById('totp').value;
  if (totp) body.totp_code = totp;
  const resp = await fetch('/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const err = document.getElementById('error');
  if (resp.status === 401) {
    document.getElementById('totp-row').hidden = false;
    err.textContent = window.t('login.totp_prompt');
    return;
  }
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    err.textContent = window.t('login.failed') + ': ' + (data.detail || resp.status);
    return;
  }
  const data = await resp.json();
  location.href = data.must_change_password ? '/account?must_change=1' : '/';
});
</script>
{% endblock %}
