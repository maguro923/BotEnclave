{% extends "base.html" %}
{% block content %}
<h1>{{ t('settings.title') }}</h1>
<div class="card">
  <form id="settings-form">
    <p>
      <label for="language">{{ t('settings.language') }}</label><br>
      <select id="language">
        <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
        <option value="ja" {% if lang == 'ja' %}selected{% endif %}>日本語</option>
      </select>
    </p>
    <p>
      <label for="timezone">{{ t('settings.timezone') }}</label><br>
      <input type="text" id="timezone" list="tz-list" value="{{ timezone }}" style="width: 60%;" spellcheck="false">
      <datalist id="tz-list">
        {% for zone in timezones %}<option value="{{ zone }}">{% endfor %}
      </datalist>
      <br><span class="muted">{{ t('settings.timezone_note') }}</span>
    </p>
    <p>
      {{ t('settings.appearance') }}<br>
      <label><input type="radio" name="appearance" value="light"> {{ t('theme.light') }}</label>
      <label><input type="radio" name="appearance" value="dark"> {{ t('theme.dark') }}</label>
    </p>
    <button type="submit">{{ t('settings.save') }}</button>
    <span id="settings-result"></span>
  </form>
</div>
<div class="card">
  <h2>{{ t('settings.clock') }}</h2>
  <p>{{ t('settings.server_time') }} <span id="server-clock">—</span>
     (<span id="server-tz">{{ timezone }}</span>)</p>
  <p class="muted">{{ t('settings.ntp') }} <span id="ntp-status">—</span></p>
</div>
<script>
const appearanceRadios = document.querySelectorAll('input[name="appearance"]');
appearanceRadios.forEach((radio) => {
  radio.checked = radio.value === document.documentElement.getAttribute('data-theme');
  radio.addEventListener('change', () => window.setTheme(radio.value));
});
document.getElementById('settings-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const resp = await apiFetch('/api/settings', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      language: document.getElementById('language').value,
      timezone: document.getElementById('timezone').value,
    }),
  });
  const result = document.getElementById('settings-result');
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    result.textContent = window.t('common.failed') + ': ' + (data.detail || resp.status);
    return;
  }
  result.textContent = window.t('common.saved');
  setTimeout(() => location.reload(), 400);
});
async function pollClock() {
  const resp = await fetch('/api/time').catch(() => null);
  if (!resp || !resp.ok) return;
  const data = await resp.json();
  document.getElementById('server-clock').textContent = data.time;
  document.getElementById('server-tz').textContent = data.timezone;
  const ntp = data.ntp || {};
  let text;
  if (ntp.synchronized === true) text = window.t('settings.ntp_synced');
  else if (ntp.synchronized === false) text = window.t('settings.ntp_unsynced');
  else text = window.t('settings.ntp_unknown');
  if (typeof ntp.offset_ms === 'number') {
    text += ' · ' + window.t('settings.ntp_offset').replace('{ms}', Math.abs(ntp.offset_ms).toFixed(1));
  }
  document.getElementById('ntp-status').textContent = text;
}
pollClock();
setInterval(pollClock, 1000);
</script>
{% endblock %}
