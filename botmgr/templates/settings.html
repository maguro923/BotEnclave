{% extends "base.html" %}
{% block content %}
<h1>{{ t('settings.title') }}</h1>
<div class="card">
  <form id="settings-form">
    <p>
      <label for="language">{{ t('settings.language') }}</label><br>
      <select id="language">
        <option value="en" {% if lang == 'en' %}selected{% endif %}>English</option>
        <option value="ja" {% if lang == 'ja' %}selected{% endif %}>日本語</option>
      </select>
    </p>
    <p>
      {{ t('settings.appearance') }}<br>
      <label><input type="radio" name="appearance" value="light"> {{ t('theme.light') }}</label>
      <label><input type="radio" name="appearance" value="dark"> {{ t('theme.dark') }}</label>
    </p>
    <button type="submit">{{ t('settings.save') }}</button>
    <span id="settings-result"></span>
  </form>
</div>
<script>
const appearanceRadios = document.querySelectorAll('input[name="appearance"]');
appearanceRadios.forEach((radio) => {
  radio.checked = radio.value === document.documentElement.getAttribute('data-theme');
  radio.addEventListener('change', () => window.setTheme(radio.value));
});
document.getElementById('settings-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const resp = await apiFetch('/api/settings', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ language: document.getElementById('language').value }),
  });
  const result = document.getElementById('settings-result');
  if (!resp.ok) {
    const data = await resp.json().catch(() => ({}));
    result.textContent = window.t('common.failed') + ': ' + (data.detail || resp.status);
    return;
  }
  result.textContent = window.t('common.saved');
  setTimeout(() => location.reload(), 400);
});
</script>
{% endblock %}
