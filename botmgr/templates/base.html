<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}BotEnclave{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #101418; color: #e6e6e6; }
  header { display: flex; gap: 1rem; align-items: center; padding: .6rem 1rem; background: #171d24; }
  header a { color: #9ecbff; text-decoration: none; }
  header .brand { font-weight: 700; color: #e6e6e6; }
  header .spacer { flex: 1; }
  main { padding: 1rem; max-width: 1100px; margin: 0 auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid #2a323c; padding: .4rem .6rem; text-align: left; }
  button { background: #1f6feb; color: #fff; border: 0; border-radius: 6px; padding: .35rem .8rem; cursor: pointer; }
  button.danger { background: #b62324; }
  button.secondary { background: #30363d; }
  input, select { background: #0d1117; color: #e6e6e6; border: 1px solid #30363d; border-radius: 6px; padding: .4rem; }
  .badge { padding: .1rem .5rem; border-radius: 999px; background: #30363d; font-size: .85em; }
  .badge.running { background: #1a7f37; }
  .badge.crashed, .badge.attention { background: #b62324; }
  .badge.backoff { background: #9e6a03; }
  pre.log { background: #0d1117; border: 1px solid #2a323c; border-radius: 6px; padding: .6rem; height: 300px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .card { background: #171d24; border: 1px solid #2a323c; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  .notice { background: #3d2e00; border: 1px solid #9e6a03; padding: .5rem .8rem; border-radius: 6px; }
  #terminal { height: 380px; background: #000; border-radius: 6px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if user is defined and user %}
<header>
  <a class="brand" href="/">BotEnclave</a>
  <a href="/">Bots</a>
  {% if user.is_superuser %}<a href="/users">Users</a>{% endif %}
  <span class="spacer"></span>
  <span>{{ user.email }}</span>
  <a href="/account">Account</a>
  <a href="#" id="logout-link">Log out</a>
</header>
<script>
document.getElementById('logout-link').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/auth/logout', { method: 'POST' });
  location.href = '/login';
});
</script>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
